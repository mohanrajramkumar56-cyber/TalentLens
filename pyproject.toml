[project]
name = "rag-resume-bot"
version = "0.1.0"
description = "RAG-powered resume intelligence chatbot"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "python-multipart==0.0.6",
    "langchain==0.1.20",
    "langchain-community==0.0.38",
    "langchain-openai==0.1.6",
    "openai==1.23.2",
    "pypdf==3.17.4",
    "faiss-cpu==1.8.0",
    "tiktoken==0.6.0",
    "pydantic==2.7.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"